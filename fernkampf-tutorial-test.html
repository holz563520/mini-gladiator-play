(()=>{const wait=(test,ms=80)=>new Promise(res=>{const id=setInterval(()=>{try{if(test()){clearInterval(id);res();}}catch(e){}},ms);});
async function setup(){await wait(()=>window.MG?.ui&&window.MG.trader&&window.MG.bowyer);const M=window.MG;let S=M.s;
 window.ArenaTheoryIntro?.finish?.();await wait(()=>!window.ArenaTheoryIntro?.active?.());
 if(!S.lanista){await wait(()=>document.getElementById('lanistaName')&&document.querySelector('[data-action="ludus:start"]'));document.getElementById('lanistaName').value='Marcus';document.querySelector('[data-action="ludus:start"]').click();}
 await new Promise(r=>setTimeout(r,600));if(M.intro?.active?.())M.intro.skip();await wait(()=>M.s.lanista&&!M.intro?.active?.());S=M.s;
 // Spielstand wie nach dem Boxkampf-Tutorial: Schmied da, Sklavenhändler eingeführt, Hühnerschule und Boxen erledigt
 const W=M.workshop;if(!W.state.master)W.hireMaster({...W.sketch(),name:'Aurifex'});W.setIntro('done');M.forgeIntro?.skipScene?.();
 if(M.trader)M.trader.state.intro='done';S.lion={...(S.lion||{}),stage:'skip'};S.huehner={...(S.huehner||{}),stage:'end'};S.hall={...(S.hall||{}),tut:'done'};
 S.box={...(S.box||{}),intro:true,fights:3,wins:2};
 const need=5-S.roster.filter(g=>!g.dead).length;if(need>0)M.army.recruitMany(need);for(const g of S.roster){g.fatigue=0;g.blood=100;if(g.role==='Fernkämpfer')g.role='Soldat';}
 for(const g of S.roster){const w=M.gear(g,'weapon');if(w&&['bow','crossbow'].includes(w.def))g.equipment.weapon=null;}S.inventory=S.inventory.filter(i=>!['bow','crossbow'].includes(i.def));
 S.gold=35;try{M.trader.stock();}catch(e){}
 M.ui.close?.();M.ui.click('nav:home');await wait(()=>{const d=document.querySelector('.smith-loading');if(!d)return true;d.querySelector('button.btn')?.click();return false;},300);panel();window.BOWYER_TEST.auto=true;}
function panel(){const p=document.createElement('section');p.id='bowTest';if(innerWidth<700)p.classList.add('min');p.innerHTML=`<b>TEST · FERNKAMPF-TUTORIAL ▾</b><button data-t="start">▶ Tutorial jetzt starten</button><button data-t="arena">▶ Nur Arena-Teil (Apfelschuss)</button><button data-t="gold">+500 Gold</button><button data-t="day">☀ Neuer Tag (Apfelschuss wieder frei)</button><button data-t="reset">↺ Zurücksetzen</button><button data-t="apple">🍎 Apfelschuss direkt öffnen</button><small>Wegwerf-Spielstand nur im Arbeitsspeicher. Neu laden = frischer Stand. Startet nach dem Laden von selbst, wie im Spiel nach dem Boxkampf-Tutorial.</small>`;document.body.appendChild(p);
 p.querySelector('b').onclick=()=>p.classList.toggle('min');
 p.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const M=window.MG,k=b.dataset.t;
  if(k==='start'){M.bowyer.reset();M.ui.close?.();M.ui.click('nav:home');M.bowyer.start();}
  else if(k==='arena'){const S=M.s;let g=S.roster.find(x=>x.role==='Fernkämpfer');if(!g){g=S.roster.find(x=>!x.dead);g.role='Fernkämpfer';const it=M.makeItem('weapon','bow',1),dg=M.makeItem('weapon','dagger',1);S.inventory.push(it,dg);g.equipment.weapon=it.id;g.equipment.secondary=dg.id;}Object.assign(M.bowyer.state(),{stage:'apple',recruit:g.id,loan:150});M.bowyer.arena();}
  else if(k==='gold'){M.s.gold+=500;M.ui.render?.();}
  else if(k==='day'){M.s.day=(M.s.day||1)+1;M.ui.render?.();document.querySelector('.bow-apple')?.remove();M.ui.notify?.('Tag '+M.s.day);}
  else if(k==='reset')location.reload();
  else if(k==='apple'){const S=M.s;if(!S.roster.some(x=>x.role==='Fernkämpfer')){const g=S.roster.find(x=>!x.dead);Object.assign(M.bowyer.state(),{stage:'done',recruit:g.id});g.role='Fernkämpfer';const it=M.makeItem('weapon','bow',1),dg=M.makeItem('weapon','dagger',1);S.inventory.push(it,dg);g.equipment.weapon=it.id;g.equipment.secondary=dg.id;}M.bowyer.openApple();}});}
setup();})();
