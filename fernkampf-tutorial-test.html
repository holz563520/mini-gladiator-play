 window.ArenaTheoryIntro?.finish?.();await wait(()=>!window.ArenaTheoryIntro?.active?.());
 if(!S.lanista){await wait(()=>document.getElementById('lanistaName')&&document.querySelector('[data-action="ludus:start"]'));document.getElementById('lanistaName').value='Marcus';document.querySelector('[data-action="ludus:start"]').click();}
 await new Promise(r=>setTimeout(r,600));if(M.intro?.active?.())M.intro.skip();await wait(()=>M.s.lanista&&!M.intro?.active?.());S=M.s;
 // Spielstand wie nach dem Boxkampf-Tutorial: Schmied da, Sklavenhändler eingeführt, Hühnerschule und Boxen erledigt
 const W=M.workshop;if(!W.state.master)W.hireMaster({...W.sketch(),name:'Aurifex'});W.setIntro('done');M.forgeIntro?.skipScene?.();
 if(M.trader)M.trader.state.intro='done';S.lion={...(S.lion||{}),stage:'skip'};S.huehner={...(S.huehner||{}),stage:'end'};S.hall={...(S.hall||{}),tut:'done'};

 const need=5-S.roster.filter(g=>!g.dead).length;if(need>0)M.army.recruitMany(need);for(const g of S.roster){g.fatigue=0;g.blood=100;if(g.role==='Fernkämpfer')g.role='Soldat';}
 S.gold=35;try{M.trader.stock();}catch(e){}
 M.ui.close?.();M.ui.click('nav:home');await wait(()=>{const d=document.querySelector('.smith-loading');if(!d)return true;d.querySelector('button.btn')?.click();return false;},300);panel();window.BOWYER_TEST.auto=true;}

  else if(k==='gold'){M.s.gold+=500;M.ui.render?.();}

  else if(k==='apple')window.BOWYER_TEST.openApple();});}
