<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- ARENA THEORY 3.0 · EIGENER EINSTIEG (Schritt G1): englisch, lädt nur Dateien aus at3/ und nur übernommene Objekte, misst die eigene Startlast. G3: Startbild mit drei Spielständen (spielstand.js). V1: Knopf „Voice“ lädt die englische Stimme erst beim Einschalten. G4a: Kartenansicht der Welt (weltkarte.js, Bilder aus dem Bildkern bildkern.js), startet mit dem Kern. G2: Uhr-Leiste; Weltkern und Helferkerne (kernstart.js) starten erst nach dem ersten Bild. Liest und schreibt keine Spielstände aus 1.0/2.0. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Arena Theory III</title>
<link rel="stylesheet" href="spiel.css?v=163a42d6">
</head>
<body>
<header class="papier">
 <h1 id="titel">Arena Theory III</h1>
 <p class="unter" id="unter"></p>
 <button id="stimmeKnopf" class="knopf klein" aria-pressed="false">Voice: off</button>
 <button id="speicherKnopf" class="knopf klein" hidden>Save &amp; quit</button>
</header>
<main>
 <section class="papier" id="uhr" aria-label="World clock">
  <span id="uhrZeit" aria-live="off">World time –</span>
  <span class="uhrKnoepfe"><button class="knopf klein" data-tempo="0" aria-pressed="false" disabled>Pause</button><button class="knopf klein" data-tempo="1" aria-pressed="false" disabled>1×</button><button class="knopf klein" data-tempo="2" aria-pressed="false" disabled>2×</button><button class="knopf klein" data-tempo="3" aria-pressed="false" disabled>3×</button></span>
  <p id="uhrInfo" class="leise"></p>
  <p id="speicherInfo" class="leise" aria-live="polite"></p>
 </section>
 <section class="papier" id="welt">
  <div class="kopf"><h2 id="weltTitel"></h2><span class="uhrKnoepfe"><button id="bauKnopf" class="knopf klein" aria-pressed="false" disabled>Build</button><button id="warenKnopf" class="knopf klein" aria-pressed="false" disabled>Goods</button><button id="fpKnopf" class="knopf klein" aria-pressed="false" disabled>First person</button><button id="zoomRaus" class="knopf klein" aria-label="Zoom out">−</button><button id="zoomRein" class="knopf klein" aria-label="Zoom in">+</button></span></div>
  <canvas id="weltCv" class="pixel" aria-label="World map"></canvas>
  <div id="fpRahmen" hidden><canvas id="fpCv" class="pixel" width="320" height="180" aria-label="First person view"></canvas><div id="fpStick" hidden></div></div>
  <p id="weltInfo" class="karte" aria-live="polite"></p>
  <div id="bauLeiste" hidden><div id="bauWerkzeuge"></div><p id="bauInfo" class="karte" aria-live="polite"></p><p id="bauGold" class="leise"></p></div>
  <div id="warenLeiste" hidden></div>
 </section>
 <section class="papier" id="feld">
  <h2 id="bodenTitel"></h2>
  <p class="leise" id="bodenInfo"></p>
  <canvas id="boden" class="pixel" width="384" height="240" aria-label="Prototype ground"></canvas>
  <p id="zaehler" class="leise"></p>
  <p id="karte" class="karte" aria-live="polite"></p>
 </section>
 <section class="papier" id="mess" hidden>
  <div class="kopf"><h2 id="messTitel"></h2><button id="messZu" class="knopf klein"></button></div>
  <div id="messInhalt"></div>
  <button id="messKopie" class="knopf"></button>
 </section>
</main>
<footer class="papier" id="status" aria-live="polite">Sharpening the pixels …</footer>
<button id="messAuf" class="knopf"></button>
<script src="at3-64.js?v=163a42d6"></script>
<script src="spielstand.js?v=163a42d6"></script>
<script src="spiel.js?v=163a42d6"></script>
</body></html>
